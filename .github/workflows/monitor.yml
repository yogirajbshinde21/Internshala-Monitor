name: Internshala Monitor

on:
  # Configurable schedule - runs every 2 hours by default
  # To change frequency, update the cron expression:
  # Every 1 hour:  '0 * * * *'
  # Every 2 hours: '0 */2 * * *'
  # Every 4 hours: '0 */4 * * *'
  # Every 6 hours: '0 */6 * * *'
  # Every 8 hours: '0 */8 * * *'
  # Every 12 hours: '0 */12 * * *'
  # Once daily at 9 AM: '0 9 * * *'
  # Twice daily (9 AM & 6 PM): '0 9,18 * * *'
  schedule:
    - cron: '0 */2 * * *'  # Default: Every 2 hours
  
  # Allow manual triggering
  workflow_dispatch:
  
  # Run on push to main branch (for initial setup)
  push:
    branches:
      - main

jobs:
  monitor-internships:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create data directory
        run: mkdir -p data
      
      - name: Run Internshala Monitor
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py
      
      - name: Commit and push changes (if any)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/seen_internships.json data/daily_email_log.json data/pending_batch.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update monitoring data - $(date '+%Y-%m-%d %H:%M:%S')"
          git push
        continue-on-error: true
